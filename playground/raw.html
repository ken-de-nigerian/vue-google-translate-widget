<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Raw Google widget probe</title>
  </head>
  <body>
    <h1>Welcome to our website</h1>
    <p>The quick brown fox jumps over the lazy dog.</p>
    <div id="probe_host" style="display: none"></div>

      window.probeInit = function () {
        new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'probe_host')
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=probeInit"></script>
  </body>
