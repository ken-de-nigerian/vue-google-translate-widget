name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it replaces.
# Only the newest commit's result decides anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint, Types & Packaging

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # publint checks the package.json fields against what's in dist;
      # attw checks that TypeScript resolves the types for both ESM and CJS.
      - name: Check published package
        run: npm run check:publish

      - name: Check bundle size
        run: npm run size

  test:
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }} / Vue ${{ matrix.vue }}

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        vue: ['3.3', '3.4', '3.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The peer range is ^3.3.0, so every supported minor gets tested, not just
      # the one in the lockfile.
      - name: Install Vue ${{ matrix.vue }}
        run: npm install --no-save vue@~${{ matrix.vue }}.0

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == 24 && matrix.vue == '3.5'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
