version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript compiler API yet, which vue-tsc and the declaration
      # build need. Revisit when vue-tsc supports it.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
